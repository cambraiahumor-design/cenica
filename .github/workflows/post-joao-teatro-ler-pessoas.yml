name: Post Instagram @joaocambraia — Teatro e ler pessoas

on:
  workflow_dispatch:
  push:
    branches: [post/joao-teatro-ler-pessoas]
    paths: [posts/joao-teatro-ler-pessoas/PUBLICAR]

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm install axios
        working-directory: scripts-instagram

      - name: Publicar carrossel no @joaocambraia
        working-directory: scripts-instagram
        env:
          IG_USER_ID: ${{ secrets.JOAO_IG_ID }}
          IG_TOKEN: ${{ secrets.JOAO_IG_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: node ig-joao-teatro-ler-pessoas.js
