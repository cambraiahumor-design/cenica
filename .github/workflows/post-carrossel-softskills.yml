name: Post Instagram — Carrossel Soft Skills e Teatro

on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm install axios
        working-directory: scripts-instagram

      - name: Publicar carrossel no Instagram
        working-directory: scripts-instagram
        env:
          IG_USER_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node ig-carrossel-softskills.js
